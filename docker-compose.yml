services:
  finally:
    build:
      context: .
      dockerfile: Dockerfile
    image: finally:latest
    container_name: finally-app
    ports:
      - "8000:8000"
    volumes:
      - finally-data:/app/db
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

volumes:
  finally-data:
